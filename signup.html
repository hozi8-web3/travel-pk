<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TravelPk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="assets/logo.png" alt="TravelPk Logo">
            </a>
            <div class="ms-auto">
                <a href="index.html" class="text-decoration-none text-muted me-3">Home</a>
            </div>
        </div>
    </nav>
    <div class="page-content">
        <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
            <div class="card shadow border-0" style="max-width: 500px; width: 100%;">
                <div class="card-body p-4">
                    <h3 class="text-center fw-bold mb-4" style="color: var(--primary-color);">Create Account</h3>
                    <div id="signupError" class="alert alert-danger d-none" role="alert"></div>
                    <div id="signupSuccess" class="alert alert-success d-none" role="alert"></div>
                    <form id="signupForm">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Full Name</label>
                            <input type="text" class="form-control" id="signupName" placeholder="HOZI" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Email Address</label>
                            <input type="email" class="form-control" id="signupEmail" placeholder="abc@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Phone Number</label>
                            <input type="tel" class="form-control" id="signupPhone" placeholder="+92 300 1234567" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Password</label>
                                <input type="password" class="form-control" id="signupPassword" placeholder="******" required minlength="6">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Confirm Password</label>
                                <input type="password" class="form-control" id="signupConfirmPassword" placeholder="******" required minlength="6">
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label small" for="terms">I agree to the <a href="#">Terms &
                                    Conditions</a></label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>

                        <p class="text-center mt-4 small text-muted">
                            Already have an account? <a href="login.html" class="fw-bold"
                                style="color: var(--primary-color);">Login</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>



    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-4 mb-4">
                    <h5 class="text-warning">TravelPk</h5>
                    <p class="small">Making your travel dreams a reality in Pakistan.</p>
                </div>
                <div class="col-md-4 mb-4">
                    <h5 class="text-warning">Quick Links</h5>
                    <ul class="list-unstyled">
                        <li><a href="index.html" class="text-white text-decoration-none">Home</a></li>
                        <li><a href="cities.html" class="text-white text-decoration-none">Destinations</a></li>
                        <li><a href="hotels.html" class="text-white text-decoration-none">Hotels</a></li>
                    </ul>
                </div>
                <div class="col-md-4 mb-4">
                    <h5 class="text-warning">Contact</h5>
                    <ul class="list-unstyled small">
                        <li>Email: info@travelpk.com</li>
                        <li>Phone: +92 300 1234567</li>
                    </ul>
                </div>
            </div>
            <div class="text-center border-top border-secondary pt-3 small text-white">
                &copy; 2026 Tourism Booking System. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Check if already logged in
        if (isLoggedIn()) {
            const user = getCurrentUser();
            window.location.href = user.role === 'admin' ? 'admin/dashboard.html' : 'dashboard.html';
        }

        // Handle signup form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const errorDiv = document.getElementById('signupError');
            const successDiv = document.getElementById('signupSuccess');
            
            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');
            
            const result = signup(name, email, phone, password, confirmPassword);
            
            if (result.success) {
                successDiv.textContent = 'Account created successfully! Redirecting...';
                successDiv.classList.remove('d-none');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                errorDiv.textContent = result.message || 'Error creating account';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Cities - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin-minimal.css">
    <link rel="icon" href="../assets/favicon.png" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light admin-navbar fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <img src="../assets/logo.png" alt="TravelPk">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <!-- Offcanvas Sidebar (Mobile) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="adminSidebar">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Admin Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="sidebar-nav">
                <li><a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="hotels.html" class="nav-link"><i class="bi bi-building"></i> Hotels</a></li>
                <li><a href="cities.html" class="nav-link active"><i class="bi bi-geo-alt"></i> Cities</a></li>
                <li><a href="promo.html" class="nav-link"><i class="bi bi-ticket-perforated"></i> Promo Codes</a></li>
                <li><a href="analytics.html" class="nav-link"><i class="bi bi-graph-up"></i> Analytics</a></li>
                <li><a href="dashboard.html" class="nav-link logout" id="logoutBtn"><i
                            class="bi bi-box-arrow-right"></i> Logout</a></li>
            </ul>
        </div>
    </div>

    <!-- Desktop Sidebar -->
    <aside class="desktop-sidebar d-none d-lg-block">
        <ul class="sidebar-nav">
            <li><a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="hotels.html" class="nav-link"><i class="bi bi-building"></i> Hotels</a></li>
            <li><a href="cities.html" class="nav-link active"><i class="bi bi-geo-alt"></i> Cities</a></li>
            <li><a href="promo.html" class="nav-link"><i class="bi bi-ticket-perforated"></i> Promo Codes</a></li>
            <li><a href="analytics.html" class="nav-link"><i class="bi bi-graph-up"></i> Analytics</a></li>
            <li><a href="dashboard.html" class="nav-link logout" id="logoutBtnDesktop"><i
                        class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main with-sidebar" style="margin-top: 56px;">
        <div class="container-fluid">
            <div class="admin-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <h1 class="mb-0">Cities Management</h1>
                <button class="btn btn-primary" id="addCityBtn">+ Add New City</button>
            </div>

            <!-- Cities Grid -->
            <div class="row g-4" id="citiesContainer">
                <!-- Cities will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="cityModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New City</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="cityForm">
                        <div class="form-group mb-3">
                            <label class="form-label">City Name</label>
                            <input type="text" class="form-control" id="cityName" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Type</label>
                            <select class="form-select" id="cityType" required>
                                <option value="">Select Type</option>
                                <option value="Historical">Historical</option>
                                <option value="Cold Weather">Cold Weather</option>
                                <option value="Beach">Beach</option>
                                <option value="City Life">City Life</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="cityForm" class="btn btn-primary">Save City</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="admin-footer">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12 col-md-6 text-center text-md-start mb-2 mb-md-0">
                    <small>Copyright © TravelPk Admin 2026</small>
                </div>
                <div class="col-12 col-md-6 text-center text-md-end">
                    <small>
                        <a href="#" class="text-muted text-decoration-none me-3">Privacy Policy</a>
                        <a href="#" class="text-muted text-decoration-none">Terms & Conditions</a>
                    </small>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/data-init.js"></script>
    <script>
        if (!requireAdmin()) { }

        document.getElementById('logoutBtn')?.addEventListener('click', function (e) {
            e.preventDefault();
            logout();
            window.location.href = '../index.html';
        });
        document.getElementById('logoutBtnDesktop')?.addEventListener('click', function (e) {
            e.preventDefault();
            logout();
            window.location.href = '../index.html';
        });
    </script>
    <script src="../js/admin/cities.js"></script>
</body>

</html>
